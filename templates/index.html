<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналіз тональності відгуків | Модуль ШІ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 850px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Аналіз тональності тексту (Sentiment Analysis)</h2>
            <p class="text-muted">Інтеграція з Hugging Face Inference API (DistilBERT)</p>
        </div>

        <div class="card shadow-sm p-4 mb-4 bg-white border-0">
            <div class="mb-3">
                <label for="reviewText" class="form-label fw-semibold">Введіть відгук або текст (англійською):</label>
                <textarea class="form-control" id="reviewText" rows="3" placeholder="This product is brilliant, I totally love it!"></textarea>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <button class="btn btn-primary px-4" id="btnSubmit" onclick="analyzeText()">Аналізувати за допомогою ШІ</button>
                <div id="loader" class="spinner-border text-primary d-none" role="status">
                    <span class="visually-hidden">Обробка...</span>
                </div>
            </div>
        </div>

        <div class="card shadow-sm p-4 bg-white border-0">
            <h5 class="fw-semibold mb-3">Історія аналізу та візуалізація</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 50%;">Текст</th>
                            <th>Результат (Label)</th>
                            <th>Впевненість моделі</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTable">
                        {% for item in history %}
                        <tr>
                            <td>{{ item.text }}</td>
                            <td>
                                <span class="badge {{ 'bg-success' if item.label == 'POSITIVE' else 'bg-danger' }}">
                                    {{ item.label }}
                                </span>
                            </td>
                            <td>
                                <div class="progress" style="height: 18px;">
                                    <div class="progress-bar {{ 'bg-success' if item.label == 'POSITIVE' else 'bg-danger' }}" 
                                         role="progressbar" 
                                         style="width: {{ item.score }}%;">
                                        {{ item.score }}%
                                    </div>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function analyzeText() {
            const textarea = document.getElementById("reviewText");
            const btn = document.getElementById("btnSubmit");
            const loader = document.getElementById("loader");
            const text = textarea.value.trim();

            if (!text) {
                alert("Введіть текст для аналізу");
                return;
            }

            btn.disabled = true;
            loader.classList.remove("d-none");

            const formData = new FormData();
            formData.append("text", text);

            try {
                const res = await fetch("/analyze", { method: "POST", body: formData });
                const data = await res.json();

                if (data.error) {
                    alert("Помилка: " + data.error);
                } else {
                    const tbody = document.getElementById("resultsTable");
                    const isPositive = data.label === "POSITIVE";
                    const badgeClass = isPositive ? "bg-success" : "bg-danger";

                    const row = `
                        <tr>
                            <td>${data.text}</td>
                            <td><span class="badge ${badgeClass}">${data.label}</span></td>
                            <td>
                                <div class="progress" style="height: 18px;">
                                    <div class="progress-bar ${badgeClass}" role="progressbar" style="width: ${data.score}%;">
                                        ${data.score}%
                                    </div>
                                </div>
                            </td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML("afterbegin", row);
                    textarea.value = "";
                }
            } catch (err) {
                alert("Помилка запиту");
            } finally {
                btn.disabled = false;
                loader.classList.add("d-none");
            }
        }
    </script>
</body>
</html>
